server {
    listen 80;
    listen [::]:80;
    server_name guide.aameow.com;
    root /var/www/guide.aameow.com/current;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/guide.aameow.com/acme;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /media/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /search-index.json {
        add_header Cache-Control "no-cache";
    }

    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(png|jpe?g|gif|webp|svg|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
